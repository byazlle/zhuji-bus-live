<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#1565C0">
<title>诸暨实时公交</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%231976D2'/%3E%3Crect x='16' y='14' width='32' height='26' rx='5' fill='white'/%3E%3Crect x='20' y='19' width='24' height='10' rx='2' fill='%231976D2'/%3E%3Ccircle cx='24' cy='45' r='4' fill='white'/%3E%3Ccircle cx='40' cy='45' r='4' fill='white'/%3E%3C/svg%3E">
<style>
:root{
  --blue:#1976D2; --blue-d:#1259a8; --bg:#f1f3f6; --card:#fff;
  --txt:#1a1a1a; --sub:#5b6672; --line:#e3e8ee;
  --green:#2E7D32; --orange:#E65100; --star:#FFB300;
  --font-zoom: 1;
  --sat: env(safe-area-inset-top,0px);
  --sab: env(safe-area-inset-bottom,0px);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif;
  background:var(--bg); color:var(--txt); font-size:17px; line-height:1.45;
  max-width:520px; margin:0 auto; zoom:var(--font-zoom);
  min-height:calc(100vh / var(--font-zoom));
  -webkit-user-select:none; user-select:none;
}
button{font-family:inherit;border:0;background:none;color:inherit;cursor:pointer}
.page{display:none;min-height:calc(100vh / var(--font-zoom));padding-bottom:var(--sab)}
.page.active{display:block}

/* ================= 首页 ================= */
.hdr{
  background:linear-gradient(135deg,#1976D2,#0D47A1); color:#fff;
  padding:calc(8px + var(--sat)) 14px 9px;
  display:flex;align-items:center;gap:10px;
}
.hdr-t{flex:1;min-width:0;font-size:20px;font-weight:700;letter-spacing:.5px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* 字号调节（放大 / 缩小） */
.fsize{flex:0 0 auto;display:flex;gap:6px}
.fsize button{height:30px;padding:0 10px;border-radius:9px;
  background:rgba(255,255,255,.18);color:#fff;font-size:12.5px;font-weight:600;
  display:flex;align-items:center;justify-content:center;line-height:1}
.fsize button:active{background:rgba(255,255,255,.36)}
.fsize button:disabled{opacity:.35}

.searchwrap{
  position:sticky; top:0; z-index:30; background:var(--bg);
  padding:7px 12px 5px; transition:box-shadow .2s;
}
.searchwrap.stuck{box-shadow:0 2px 8px rgba(0,0,0,.10)}
.sw{position:relative}
.sw input{
  width:100%; height:50px; border:0; border-radius:14px; background:#fff;
  padding:0 44px 0 46px; font-size:17px; color:var(--txt); outline:none;
  box-shadow:0 1px 4px rgba(0,0,0,.06);
}
.sw input::placeholder{color:#9aa5b1}
.sw .ico{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:#8b97a4;display:flex;align-items:center}
.sw .clr{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:38px;height:38px;border-radius:50%;font-size:19px;color:#8b97a4;display:none;align-items:center;justify-content:center}
.sw .clr.on{display:flex}

.sec{margin-top:4px}
.stitle{
  display:flex;align-items:center;justify-content:space-between;
  padding:12px 16px 8px; font-size:16px; font-weight:700; color:#37474F;
}
.stitle .hint{font-size:13px;font-weight:400;color:#8b97a4}
.stitle .mng{font-size:15px;font-weight:600;color:var(--blue);padding:4px 2px}

.favg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:0 12px 2px}
.fcard{
  position:relative;background:#fff;border-radius:14px;
  padding:11px 6px;text-align:center;box-shadow:0 1px 4px rgba(0,0,0,.05);
  min-height:66px;display:flex;flex-direction:column;justify-content:center;
}
.fcard .fn{font-size:22px;font-weight:700;color:var(--blue);line-height:1.1;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 2px}
.fcard .fe{font-size:12px;color:#8b97a4;margin-top:3px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fcard:active{background:#eaf2fb}
.fcard .del{
  display:none;position:absolute;top:-6px;right:-6px;width:28px;height:28px;
  border-radius:50%;background:#e53935;color:#fff;font-size:16px;
  align-items:center;justify-content:center;box-shadow:0 1px 4px rgba(0,0,0,.2);
}
body.managing .fcard .del{display:flex}
.empty{
  grid-column:1/-1;background:#fff;border-radius:14px;padding:14px 16px;
  text-align:center;color:#8b97a4;font-size:14.5px;line-height:1.5;
}

.linelist{padding:0 12px 24px}
.lrow{
  display:flex;align-items:center;gap:12px;background:#fff;border-radius:14px;
  padding:9px 10px 9px 12px;margin-bottom:7px;box-shadow:0 1px 3px rgba(0,0,0,.04);
  content-visibility:auto;contain-intrinsic-size:auto 68px;
}
.lrow:active{background:#eef4fb}
.badge{
  flex:0 0 auto;min-width:56px;max-width:82px;height:44px;border-radius:11px;
  background:linear-gradient(135deg,#1e88e5,#1565C0);color:#fff;
  font-size:17px;font-weight:700;display:flex;align-items:center;justify-content:center;
  padding:0 8px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;
}
.linfo{flex:1;min-width:0}
.lname{font-size:17px;font-weight:600;line-height:1.25;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lroute{font-size:12.5px;color:#8b97a4;margin-top:1px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.star{flex:0 0 auto;width:44px;height:44px;font-size:23px;color:#b6c2cf;
  display:flex;align-items:center;justify-content:center;line-height:1}
.star.on{color:var(--star)}
.chev{flex:0 0 auto;color:#b6c2cf;font-size:24px;margin-left:-8px;padding-right:2px}

/* ================= 详情页 ================= */
#detailPage{background:var(--bg)}
.sticky{
  position:sticky; top:0; z-index:40;
  background:linear-gradient(180deg,#1565C0,#1976D2);
  padding-top:var(--sat);
  box-shadow:0 2px 10px rgba(0,0,0,.14);
}
.dtop{display:flex;align-items:center;height:46px;padding:0 4px 0 2px}
/* 返回按钮：箭头单独成元素 + nowrap，避免"返回"被折成两行 */
.back{flex:0 0 auto;height:44px;display:flex;align-items:center;
  font-size:15px;line-height:1;white-space:nowrap;color:#fff;
  padding:0 8px 0 4px;min-width:56px}
.back i{font-style:normal;font-size:19px;line-height:1;margin-right:3px;margin-top:-3px}
.back:active{opacity:.7}
.dtitle{flex:1;min-width:0;text-align:center;font-size:19px;font-weight:700;color:#fff;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* 刷新信息条：移到标题旁，点一下即手动刷新 */
.refbar{flex:0 0 auto;display:flex;align-items:center;gap:3px;
  background:rgba(255,255,255,.18);border-radius:9px;padding:4px 7px;color:#fff;
  font-size:11.5px;line-height:1;margin-right:2px}
.refbar .rt{font-variant-numeric:tabular-nums;letter-spacing:.2px}
.refbar:active{background:rgba(255,255,255,.34)}
.dstar{width:40px;height:44px;font-size:23px;color:rgba(255,255,255,.55);
  display:flex;align-items:center;justify-content:center}
.dstar.on{color:var(--star)}

.dirs{display:flex;gap:8px;padding:0 12px 7px}
/* 发车表入口：方向栏最右边 */
.ttbtn{flex:0 0 44px;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:2px;background:rgba(255,255,255,.16);border-radius:10px;color:#fff;
  font-size:9.5px;line-height:1.2;padding:4px 2px}
.ttbtn:active{background:rgba(255,255,255,.34)}
.dir{
  flex:1;min-width:0;background:rgba(255,255,255,.16);border-radius:10px;
  padding:5px 6px 6px;color:#fff;text-align:left;line-height:1.35;
  display:flex;flex-direction:column;justify-content:center;
}
.dir .dl{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dir .dl.from{font-size:12.5px;color:rgba(255,255,255,.92)}
.dir .dl.to{font-size:13.5px;font-weight:700;margin-top:2px}
.dir .dl i{display:inline-block;font-style:normal;font-size:10px;line-height:1.5;
  padding:0 3px;border-radius:4px;margin-right:4px;vertical-align:1.5px;
  background:rgba(255,255,255,.26);color:#fff;font-weight:600}
.dir.on{background:#fff;color:#0D47A1}
.dir.on .dl.from{color:#4a7db5}
.dir.on .dl i{background:rgba(21,101,192,.12);color:#1565C0}
.dir .dl.via{font-size:10.5px;color:rgba(255,255,255,.75);margin-top:1px}
.dir.on .dl.via{color:#6b7f95}

.mybar{
  display:flex;align-items:center;gap:6px;padding:4px 12px 5px;
  font-size:14px;color:#fff;background:rgba(0,0,0,.10);
}
.mybar .mtxt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mybar b{font-weight:700}
.mybar .st-warn{color:#FFE082;font-weight:700}
.mybar .geobtn{flex:0 0 auto;font-size:12.5px;background:rgba(255,255,255,.22);
  border-radius:8px;padding:3px 9px;color:#fff;line-height:1.3}
.mybar .geobtn:active{background:rgba(255,255,255,.38)}

.buses{padding:7px 12px 9px;display:flex;flex-direction:column;gap:6px}
.brow{
  background:#fff;border-radius:11px;padding:6px 11px;
  display:flex;align-items:center;gap:9px;border-left:5px solid var(--blue);
}
.brow.first{border-left-color:#E65100}
.pill{flex:0 0 auto;font-size:11.5px;font-weight:700;color:#fff;background:#E65100;
  border-radius:7px;padding:2px 6px;line-height:1.4}
.pill.ghost{background:#90A4AE}
.btime{flex:0 0 72px;font-size:19px;font-weight:800;color:#E65100;line-height:1.15;
  white-space:nowrap}
.btime.sm{font-size:16.5px}
.bdesc{flex:1;min-width:0;font-size:13.5px;color:#37474F;line-height:1.3}
.bdesc .l1,.bdesc .l2{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bdesc .l2{font-size:12.5px;color:#7b8794;margin-top:1px}
.bempty{
  background:#fff;border-radius:12px;padding:14px 12px;text-align:center;
  color:#5b6672;font-size:15px;
}
.bmore{text-align:center;color:rgba(255,255,255,.8);font-size:12.5px;padding:1px 0 0}
.bempty .sub{font-size:12.5px;color:#8b97a4;margin-top:3px}

/* 没车时：显示下一班发车时间 */
.brow.next{border-left-color:#1565C0}
.brow.next .btime{color:#1565C0;font-size:18px}
.brow.next .pill{background:#1565C0}
.bnote{text-align:center;color:rgba(255,255,255,.78);font-size:12px;padding:0 0 1px}

/* 隐性背景箭头：提示行驶方向（朝终点） */
.flowbg{
  position:fixed;right:-24px;top:56%;transform:translateY(-50%);
  width:196px;height:320px;pointer-events:none;z-index:3;
  color:#0D47A1;opacity:.045;mix-blend-mode:multiply;
  transition:transform .28s ease;
}
.flowbg.down{transform:translateY(-50%) rotate(180deg)}

.stations{padding:4px 0 24px;background:var(--bg)}
/* 站点列表表头：标题 + 正序/倒序切换 */
.slisthead{display:flex;align-items:center;gap:8px;flex-wrap:wrap;
  padding:9px 14px 7px;background:var(--bg)}
.slisthead .slt{font-size:13.5px;color:#5b6672;font-weight:600;flex:1 1 auto;min-width:0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.slisthead .slt em{font-style:normal;font-weight:400;color:#93a0ad}
.seg{display:flex;gap:4px;flex:0 0 auto}
.segb{font-size:12px;line-height:1.3;padding:4px 8px;border-radius:8px;
  background:#e6ebf1;color:#93a0ad;font-weight:600;white-space:nowrap}
.segb.on{background:var(--blue);color:#fff}
.segb:active{opacity:.85}
.st{
  display:flex;align-items:stretch;gap:10px;padding:0 14px;position:relative;
  background:var(--bg);
}
.st:active{background:#e7ecf3}
.rail{flex:0 0 22px;display:flex;flex-direction:column;align-items:center}
.rail .ln{width:3px;flex:1;background:#cdd7e2}
.rail .ln.hide{background:transparent}
.rail .dot{width:13px;height:13px;border-radius:50%;background:#b8c4d0;
  margin:2px 0;flex:0 0 auto;transition:all .15s}
.st .body{flex:1;min-width:0;display:flex;align-items:center;gap:6px;
  padding:11px 0;border-bottom:1px solid #eceff3}
.st:last-child .body{border-bottom:0}
.sname{font-size:18px;line-height:1.3;flex:0 1 auto;min-width:0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.st .grow{flex:1;min-width:2px}
.st.passed .sname{color:#93a0ad}
.st.mine .body{background:rgba(76,175,80,.08)}
.st.mine .sname{color:var(--green);font-weight:800}
.st.mine .dot{background:#43A047;width:17px;height:17px;box-shadow:0 0 0 4px rgba(67,160,71,.18)}
.tag{flex:0 0 auto;font-size:12px;font-weight:700;color:#fff;border-radius:9px;
  padding:2px 7px;line-height:1.6}
.tag.end{background:#FB8C00}
.tag.start{background:#1e88e5}
.tag.mine{background:#43A047}
.tag.bus{background:#546E7A;font-size:13px;padding:1px 6px}
.foot{text-align:center;color:#a9b3bd;font-size:12px;padding:4px 0 20px}

/* 放大字体时（124%/136%），方向按钮改成上下两行，右边的发车表跨两行，文字不再被截断 */
body[data-z="1.24"] .dirs,body[data-z="1.36"] .dirs{
  display:grid;grid-template-columns:1fr 44px;gap:6px;align-items:stretch;
}
body[data-z="1.24"] .dir,body[data-z="1.36"] .dir{grid-column:1}
body[data-z="1.24"] .ttbtn,body[data-z="1.36"] .ttbtn{grid-column:2;grid-row:1 / span 2;height:auto}

/* 小屏（<=359dp）自适应，避免方向按钮和车辆信息被截断 */
@media (max-width:359px){
  /* 超窄屏方向按钮也上下排，保证站名完整 */
  .dirs{display:grid;grid-template-columns:1fr 44px;gap:6px;align-items:stretch}
  .dir{grid-column:1;padding:4px 6px 5px}
  .ttbtn{grid-column:2;grid-row:1 / span 2;height:auto}
  .dir .dl.from{font-size:11.5px}
  .dir .dl.to{font-size:12px}
  .dir .dl i{font-size:9.5px;margin-right:3px}
  .btime{flex-basis:64px;font-size:17.5px}
  .bdesc{font-size:13px}
  .bdesc .l2{font-size:12px}
  .sname{font-size:17px}
  .slisthead{padding:8px 12px 6px;gap:6px}
  .slisthead .slt{font-size:12.5px}
  .segb{font-size:11.5px;padding:4px 6px}
}

/* ===== 发车表（底部弹层） ===== */
.mask{position:fixed;left:0;right:0;top:0;bottom:0;background:rgba(0,0,0,.45);
  z-index:200;display:none;align-items:flex-end}
.mask.on{display:flex}
.sheet{width:100%;max-width:520px;margin:0 auto;background:#fff;
  border-radius:18px 18px 0 0;max-height:78vh;overflow:auto;
  padding-bottom:var(--sab);animation:up .2s ease-out}
@keyframes up{from{transform:translateY(36px);opacity:.5}to{transform:none;opacity:1}}
.sheet-h{display:flex;align-items:center;justify-content:space-between;
  padding:14px 16px 10px;border-bottom:1px solid #eef1f4;
  position:sticky;top:0;background:#fff;z-index:1}
.sheet-h b{font-size:18px;color:#1a1a1a}
.sheet-x{font-size:15px;font-weight:600;color:var(--blue);
  background:#eef4fb;border-radius:9px;padding:6px 12px}
.sheet-x:active{background:#dfeaf8}
.tt-dir{padding:14px 16px 2px;font-size:16.5px;font-weight:700;color:#1565C0;
  display:block;line-height:1.35}
.tt-dir .cur{display:inline-block;font-size:11px;font-weight:700;color:#fff;
  background:var(--blue);border-radius:6px;padding:1px 6px;margin-left:6px;vertical-align:2px}
.tt-dir small{display:block;margin-top:2px;font-size:12.5px;font-weight:400;color:#8b97a4}
.tt-row{display:flex;gap:0;padding:6px 16px 2px}
.tt-row .it{display:flex;flex-direction:column;flex:1 1 0;min-width:0}
.tt-row .it span{font-size:12px;color:#8b97a4}
.tt-row .it b{font-size:21px;font-weight:800;color:#E65100;line-height:1.25;
  font-variant-numeric:tabular-nums;white-space:nowrap}
.tt-row .it.nx b{color:#1565C0}
.tt-row .it i{font-style:normal;font-size:11.5px;color:#5b8fc9;margin-top:1px;white-space:nowrap}
.tt-row .it.nx span{color:#5b8fc9}
.tt-meta{padding:2px 16px 14px;font-size:13.5px;color:#5b6672}
.tt-sep{height:1px;background:#f0f3f6;margin:4px 16px 0}
.tt-note{padding:12px 16px calc(18px + var(--sab));font-size:12.5px;color:#93a0ad;line-height:1.5}

.toast{
  position:fixed;left:50%;bottom:calc(28px + var(--sab));transform:translateX(-50%) translateY(20px);
  background:rgba(33,33,33,.92);color:#fff;font-size:15px;padding:10px 18px;border-radius:22px;
  opacity:0;pointer-events:none;transition:all .22s;z-index:999;max-width:88vw;text-align:center;
}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.skel{background:#e9edf2;border-radius:10px;height:16px;animation:pulse 1.2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.55}}
.loading{padding:26px 16px;text-align:center;color:#8b97a4;font-size:15px}
</style>
</head>
<body>

<!-- ================= 首页 ================= -->
<div class="page active" id="homePage">
  <div class="hdr">
    <div class="hdr-t">诸暨实时公交</div>
    <div class="fsize">
      <button id="fsDown" aria-label="缩小字体">缩小</button>
      <button id="fsUp" aria-label="放大字体">放大</button>
    </div>
  </div>

  <div class="searchwrap" id="searchwrap">
    <div class="sw">
      <span class="ico"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4.2-4.2"/></svg></span>
      <input id="q" type="text" inputmode="search" placeholder="输入线路号，如 1、105、156" autocomplete="off">
      <button class="clr" id="clrBtn">✕</button>
    </div>
  </div>

  <div class="sec">
    <div class="stitle">
      <span>我的常用线路</span>
      <span class="mng" id="mngBtn"></span>
    </div>
    <div class="favg" id="favg"></div>
  </div>

  <div class="sec">
    <div class="stitle">
      <span id="allTitle">全部线路</span>
    </div>
    <div class="linelist" id="linelist">
      <div class="loading">正在加载线路…</div>
    </div>
  </div>
</div>

<!-- ================= 详情页 ================= -->
<div class="page" id="detailPage">
  <div class="sticky" id="sticky">
    <div class="dtop">
      <button class="back" id="backBtn"><i>‹</i>返回</button>
      <div class="dtitle" id="dtitle">—</div>
      <button class="refbar" id="refBar" title="点击立即刷新">
        <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 4v5h-5"/></svg>
        <span class="rt" id="refTime">--:--</span>
      </button>
      <button class="dstar" id="dstar">☆</button>
    </div>
    <div class="dirs" id="dirs"></div>
    <div class="mybar" id="mybar"></div>
    <div class="buses" id="buses"></div>
  </div>

  <div class="slisthead">
    <span class="slt">站点列表<em id="orderHint">（终点在最上面）</em></span>
    <div class="seg">
      <button class="segb on" data-order="desc">终点站在上</button>
      <button class="segb" data-order="asc">起点站在上</button>
    </div>
  </div>
  <div class="stations" id="stations">
    <div class="loading">正在加载站点…</div>
  </div>

function hav(a, b, c, d) {
  if (!a || !b || !c || !d) return 0;
  const R = 6371000, r = Math.PI / 180;

function checkJson(json) {
  const code = String(json.code || json.returnFlag || '');
  if (code !== '200') throw new Error(json.msg || json.returnInfo || '接口返回异常');
  return json.data || {};
}
// 老版本 WebView（无 fetch）走 XHR
function apiXhr(path, body) {
  return new Promise((resolve, reject) => {
    const xhr = new XMLHttpRequest();
    xhr.open('POST', API_BASE + path, true);
    xhr.setRequestHeader('Content-Type', 'application/json');
    xhr.timeout = 13000;
    xhr.onload = () => {
      if (xhr.status < 200 || xhr.status >= 300) return reject(new Error('服务器 ' + xhr.status));
      try { resolve(checkJson(JSON.parse(xhr.responseText))); } catch (e) { reject(e); }
    };
    xhr.onerror = () => reject(new Error('网络不通'));
    xhr.ontimeout = () => reject(new Error('网络超时'));
    xhr.send(JSON.stringify({ h: API_H, b: body }));
  });
}
async function api(path, body, retry) {
  if (typeof fetch !== 'function' || typeof AbortController !== 'function') return apiXhr(path, body);
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), 13000);
  try {
    const res = await fetch(API_BASE + path, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ h: API_H, b: body }),
      signal: ctrl.signal,
      cache: 'no-store'
    });
    if (!res.ok) throw new Error('服务器 ' + res.status);
    return checkJson(await res.json());
  } catch (e) {
    if (retry !== false && (e.name === 'AbortError' || e.message === 'Failed to fetch')) {
      await new Promise(r => setTimeout(r, 400));
      return api(path, body, false);
    }
    throw e.name === 'AbortError' ? new Error('网络超时') : e;
  } finally {
    clearTimeout(timer);
  }
}

const LINE_KEY = 'zjbus.lines.v2';

function lineKey(n) { const m = n.match(/^(\d+)/); return m ? [0, +m[1], n] : [1, 0, n]; }
function sortLines(arr) {
  return arr.slice().sort((a, b) => {
    const ka = lineKey(a.lineName), kb = lineKey(b.lineName);
    if (ka[0] !== kb[0]) return ka[0] - kb[0];
    if (ka[1] !== kb[1]) return ka[1] - kb[1];
    return ka[2] < kb[2] ? -1 : ka[2] > kb[2] ? 1 : 0;
  });
}
function loadLines() {

  } catch (e) { /* 静默失败，继续用内置数据 */ }
  linesRefreshing = false;
}

const FAV_KEY = 'zjbus.favs.v1';
const MAX_FAV = 30;

function saveFavs() { LS.set(FAV_KEY, FAVS); }
function isFav(n) { return FAVS.indexOf(n) > -1; }
function toggleFav(n) {

/* 本地找不到时，再去接口搜一次（内置列表万一缺了新线路） */
let remoteKw = '';
async function remoteSearch(kw) {
  remoteKw = kw;
  try {
    const d = await apiSearch(kw, 1, 30);
    const list = (d.list || []).map(r => ({
      lineName: r.lineName, startStation: r.startStation || '', endStation: r.endStation || ''
    })).filter(r => r.lineName);
    let added = 0;
    list.forEach(r => {
      if (!LINES.some(l => l.lineName === r.lineName)) { LINES.push(r); added++; }
    });
    if (added) {
      LINES = sortLines(LINES);
      LS.set(LINE_KEY, { t: Date.now(), list: LINES });
      renderFavs();
    }
    if (list.length && ($('q').value || '').trim().toUpperCase() === kw.toUpperCase()) renderLines();
  } catch (e) { /* 网络不行就维持"没找到" */ }
}

function renderLines() {
  const kw = ($('q').value || '').trim().toUpperCase();
  const box = $('linelist');
  let arr = LINES;
  if (kw) {
    const k = kw.replace(/路$/, '');
    arr = LINES.filter(l => {
      const n = l.lineName.toUpperCase().replace(/路$/, '');
      return n.indexOf(k) > -1 || l.endStation.indexOf(kw) > -1 || l.startStation.indexOf(kw) > -1;
    });
  }
  $('allTitle').textContent = kw ? '搜索结果 ' + arr.length + ' 条' : '全部线路';
  if (!arr.length) {
    box.innerHTML = '<div class="empty">没找到「' + esc(kw) + '」这条线路</div>';
    if (kw && kw !== remoteKw) remoteSearch(kw);
    return;
  }
  box.innerHTML = arr.map(l => `<div class="lrow" data-line="${esc(l.lineName)}">
      <div class="badge">${esc(shortName(l.lineName))}</div>
      <div class="linfo">

        <div class="lroute">${esc(l.startStation)} → ${esc(l.endStation)}</div>
      </div>

}

/* ==================== 发车表 / 下一班 ==================== */
function hm(t) { return t ? String(t).slice(0, 5) : '—'; }
function toMin(t) {
  if (!t) return -1;
  const a = String(t).split(':');
  const h = Number(a[0]), m = Number(a[1]);
  if (!isFinite(h) || !isFinite(m)) return -1;
  return h * 60 + m;
}
function nowMinute() { const d = new Date(); return d.getHours() * 60 + d.getMinutes(); }
function minHM(m) {
  m = Math.round(((m % 1440) + 1440) % 1440);
  const h = Math.floor(m / 60), mi = m % 60;
  return (h < 10 ? '0' : '') + h + ':' + (mi < 10 ? '0' : '') + mi;
}
/* 起点到第 i 站（0 基）的累计里程；lastDistance 是「到上一站」的距离 */
function cumDist(i) {
  let s = 0;
  for (let k = 1; k <= i; k++) s += Number((state.stations[k] || {}).lastDistance) || 0;
  return s;
}
/* 起点到第 i 站大约要开多少分钟 */
function runMinutesTo(i) {
  if (i <= 0) return 0;
  return cumDist(i) / (state.speed || 240) + i * 0.35;
}
/* 官方「下一班发车时间」+ 到我这站的预计时间 */
function nextDepInfo() {  const dep = toMin(state.startTime);
  if (dep < 0) return null;
  const mi = myIndex();
  const toIdx = mi >= 0 ? mi : state.stations.length - 1;
  if (toIdx < 0) return null;
  return { dep, wait: dep - nowMinute(), eta: dep + runMinutesTo(toIdx), mi };
}
function ttHtml(live) {
  let out = '';
  [['up', state.data.up], ['down', state.data.down]].forEach(pair => {
    const key = pair[0], s = pair[1];
    if (!s) return;
    const st = (s.stationList || []).slice().sort((a, b) => (a.stationOrder || 0) - (b.stationOrder || 0));
    const lv = live[key] || {};
    const dep = toMin(lv.startTime);
    const nm = nowMinute();
    const meta = [];
    if (s.lineLength) meta.push('全程 ' + s.lineLength + ' 公里');
    if (st.length) meta.push('共 ' + st.length + ' 站');
    if (s.totalPrice) meta.push('票价 ' + s.totalPrice + ' 元');
    if (key === state.dir) {
      const myIdx = myIndex();
      if (myIdx > 0) meta.push('到你选的站约 ' + Math.round(runMinutesTo(myIdx)) + ' 分钟');
    }
    out += `<div class="tt-dir">开往 ${esc(s.endStation || '')}${key === state.dir ? '<span class="cur">当前</span>' : ''}
        <small>从 ${esc(s.startStation || '')} 发车</small>
      </div>
      <div class="tt-row">
        <div class="it"><span>首班</span><b>${hm(s.startFirst)}</b></div>
        <div class="it"><span>末班</span><b>${hm(s.startLast)}</b></div>
        <div class="it nx"><span>下一班</span><b>${dep >= 0 ? minHM(dep) : '—'}</b>${
          dep >= 0 && dep > nm ? `<i>还有 ${dep - nm} 分钟</i>` : (dep >= 0 ? '<i>已发车</i>' : '<i>暂无</i>')}</div>
      </div>
      <div class="tt-meta">${meta.map(esc).join(' · ') || '暂无更多信息'}</div>
      <div class="tt-sep"></div>`;
  });
  return out;
}
async function openTimetable() {
  const d = state.data;
  if (!d) return;
  $('ttBody').innerHTML = '<div class="tt-note">正在获取发车信息…</div>';
  $('ttMask').classList.add('on');
  // 当前方向用已有数据，另一个方向现拉一次，保证两边都是真实发车时间
  const live = {};
  live[state.dir] = { startTime: state.startTime, list: state.raw, speed: state.speed };
  const other = state.dir === 'up' ? 'down' : 'up';
  if (d[other] && d[other].id) {
    try {
      const v = await apiVehicles(d[other].id);
      live[other] = {
        startTime: v.startTime || '',
        list: Array.isArray(v.list) ? v.list : [],
        speed: Number(v.busAverageSpeed) || state.speed
      };
    } catch (e) {
      live[other] = { startTime: '', list: [], speed: state.speed };
    }
  }
  if (!$('ttMask').classList.contains('on')) return;
  $('ttBody').innerHTML = ttHtml(live) +
    '<div class="tt-note">首班、末班和「下一班」发车时间来自诸暨公交官方数据；「到你选的站」是按线路里程和平均车速估算，仅供参考。</div>';
}
function closeTimetable() { $('ttMask').classList.remove('on'); }
$('ttClose').addEventListener('click', closeTimetable);
$('ttMask').addEventListener('click', e => { if (e.target.id === 'ttMask') closeTimetable(); });

function dirData() { return state.data ? state.data[state.dir] : null; }

/* 载入当前方向的站点；resetChoice=true 时尝试恢复上次的选择 */
function applyDirection(first) {
  const d = dirData();
  if (!d) return;
  const raw = (d.stationList || []).slice();
  raw.sort((a, b) => (a.stationOrder || 0) - (b.stationOrder || 0));
  state.stations = raw;
  state.segs = [];
  for (let i = 0; i < raw.length - 1; i++) {
    let s = hav(raw[i].poiOriginLat, raw[i].poiOriginLon, raw[i + 1].poiOriginLat, raw[i + 1].poiOriginLon);
    if (!s || s > 5000) s = Number(raw[i + 1].lastDistance) || 500;   // 坐标异常时用接口给的段长
    state.segs.push(s);
  }
  state.raw = [];
  state.sig = '';
  state.nearest = null;
  state.lastAt = null;
  state.startTime = '';
  state.reqId++;          // 让上一个方向的请求作废

  // 恢复该线路该方向上次选的站；切换方向时按站名匹配（上下行站点 id 不同）
  const saved = LS.get(ST_KEY, {});
  const key = state.line + '|' + state.dir;
  const otherKey = state.line + '|' + (state.dir === 'up' ? 'down' : 'up');
  let rec = saved[key] || null;
  if (rec && typeof rec === 'string') rec = { id: rec, name: '' };   // 兼容旧数据
  let id = '';
  if (rec) {
    if (rec.id && raw.some(s => s.id === rec.id)) id = rec.id;
    else if (rec.name) { const m = raw.find(s => s.stationName === rec.name); if (m) id = m.id; }
  }
  if (!id) {
    const o = saved[otherKey];
    const orec = typeof o === 'string' ? { id: o, name: '' } : o;
    if (orec && orec.name) { const m = raw.find(s => s.stationName === orec.name); if (m) id = m.id; }
  }
  state.myId = id;
  renderStations();
  renderMybar();
  renderRef();
  loadBuses();
  if (first) autoLocateOnOpen();   // 进入线路页自动定位，并滚到所在站点
  else jumpToMyStation();          // 换方向后站点顺序全变，重新滚到"我在这"
}

function myIndex() {
  if (!state.myId) return -1;
  return state.stations.findIndex(s => s.id === state.myId);
}

function renderStations() {
  const st = state.stations;
  const n = st.length;
  if (!n) { $('stations').innerHTML = '<div class="loading">这个方向暂无站点</div>'; return; }
  const mi = myIndex();
  const busOrders = new Set();
  state.raw.forEach(b => { const o = Number(b.vehicleOrder) || 0; if (o > 0) busOrders.add(o); });

  let html = '';
  for (let p = 0; p < n; p++) {
    // 显示第 p 行对应的「升序下标」：倒序时终点在最上，正序时起点在最上
    const idx = state.desc ? n - 1 - p : p;
    const s = st[idx];
    const mine = idx === mi;
    const passed = mi >= 0 && idx < mi;      // 比你更靠近起点 = 车已经开过去了
    const first = p === 0, last = p === n - 1;
    const leftTags = [];
    const rightTags = [];
    if (idx === 0) rightTags.push('<span class="tag start">起点站</span>');
    if (idx === n - 1) rightTags.push('<span class="tag end">终点站</span>');
    if (mine) rightTags.push('<span class="tag mine">你在这</span>');
    if (busOrders.has(s.stationOrder)) leftTags.push('<span class="tag bus" data-busmark="1">🚌</span>');
    html += `<div class="st${mine ? ' mine' : ''}${passed ? ' passed' : ''}" data-id="${esc(s.id)}" data-o="${s.stationOrder}">
      <div class="rail">
        <i class="ln${first ? ' hide' : ''}"></i>
        <i class="dot"></i>
        <i class="ln${last ? ' hide' : ''}"></i>
      </div>
      <div class="body">
        <span class="sname">${esc(s.stationName)}</span>${leftTags.join('')}
        <span class="grow"></span>${rightTags.join('')}
      </div>
    </div>`;
  }
  $('stations').innerHTML = html;
  renderOrderUI();
}

/* 站点排序切换的选中态 + 括号说明 */
function renderOrderUI() {
  const hint = $('orderHint');

  document.querySelectorAll('.segb').forEach(b => {

/* 只更新站点上的 🚌 标记，避免整棵列表重绘造成闪烁 */
function updateBusMarks() {

  $('stations').querySelectorAll('.st').forEach(el => {
    const o = Number(el.getAttribute('data-o'));

      el.querySelector('[data-busmark]').remove();

function renderRef() {

/* ==================== 定位 ==================== */
function nearestStationByGeo(lat, lng) {
  let best = null, bestD = Infinity;
  state.stations.forEach(s => {
    const d = hav(lat, lng, s.poiOriginLat, s.poiOriginLon);
    if (isFinite(d) && d < bestD) { bestD = d; best = s; }
  });
  return best ? { station: best, dist: bestD } : null;
}

function locateMe(silent, noJump) {
  if (!navigator.geolocation) {
    if (!silent) toast('这个手机不支持定位，请点站点选择');
    return;
  }
  if (!silent) toast('正在定位…');
  let done = false;
  const fail = msg => {
    if (done) return;
    done = true;
    if (!silent) toast(msg);
    if (state.myId) setTimeout(() => scrollToMyStation(true), 120);   // 定位不了就滚到上次选的站
  };
  navigator.geolocation.getCurrentPosition(pos => {
    if (done) return;
    done = true;
    const hit = nearestStationByGeo(pos.coords.latitude, pos.coords.longitude);
    if (!hit) { if (!silent) toast('这条线附近没有站点'); return; }
    if (hit.dist > 2000) {
      if (!silent) toast('定位离这条线有点远（约 ' + Math.round(hit.dist / 1000) + ' 公里），请手动点站点');
      if (state.myId) setTimeout(() => scrollToMyStation(true), 120);
      return;
    }
    if (hit.station.id === state.myId) {
      if (!noJump) setTimeout(() => scrollToMyStation(true), 120);
      if (!silent) toast('你已经在这站：' + hit.station.stationName);
      return;
    }
    state.myId = hit.station.id;
    const saved = LS.get(ST_KEY, {});
    saved[state.line + '|' + state.dir] = { id: hit.station.id, name: hit.station.stationName };
    LS.set(ST_KEY, saved);
    renderStations();
    renderBuses();
    loadBuses(true);
    toast('已定位到：' + hit.station.stationName);
    if (!noJump) {
      setTimeout(() => scrollToMyStation(true), 150);   // 站点渲染后滚动
      setTimeout(() => scrollToMyStation(true), 750);   // 车辆卡片渲染后（吸顶高度变化）再校正一次
    }
  }, err => {
    fail(err && err.code === 1 ? '没有定位权限，请点站点选择' : '定位失败，请点站点选择');
  }, { enableHighAccuracy: true, timeout: 9000, maximumAge: 60000 });
  setTimeout(() => fail('定位超时，请点站点选择'), 10000);
}

/* 把「我在这」那一站滚到可视区中间（避开吸顶头部） */
function scrollToMyStation(smooth) {
  const el = $('stations').querySelector('.st.mine');
  if (!el) return;
  const sticky = $('sticky');
  const hdr = sticky ? sticky.getBoundingClientRect().height : 0;
  const vh = window.innerHeight;
  const r = el.getBoundingClientRect();
  if (r.top >= hdr + 8 && r.bottom <= vh - 8) return;      // 已经在可视区
  const doc = document.documentElement;
  let y = window.scrollY + r.top - hdr - Math.max(48, (vh - hdr) * 0.32);
  y = Math.max(0, Math.min(y, Math.max(0, doc.scrollHeight - vh)));
  try {
    window.scrollTo({ top: y, behavior: smooth === false ? 'auto' : 'smooth' });
  } catch (e) {
    window.scrollTo(0, y);
  }
}

/* 滚两次：第一次立刻，第二次等车辆卡片渲染完、吸顶变高后校正 */
function jumpToMyStation() {
  if (!state.myId) return;
  scrollToMyStation(true);
  setTimeout(() => scrollToMyStation(true), 700);
}

/* 打开线路时自动定位（首次会弹系统授权框），定位成功后自动滚到那一站 */
function autoLocateOnOpen() {
  if (!navigator.geolocation) return;
  locateMe(true);
}

/* ==================== 车辆计算 ==================== */
function computeBuses() {
  const st = state.stations, n = st.length;
  const mi = myIndex();
  const myOrder = mi >= 0 ? st[mi].stationOrder : 0;
  const out = [];
  state.raw.forEach(b => {
    const order = Number(b.vehicleOrder) || 0;
    if (order <= 0 || order > n) return;
    const distToNext = Math.max(0, Number(b.distance) || 0);
    const segLen = state.segs[order - 1] || 0;
    const hasNext = !!st[order];                  // 还有下一站（不是终点站）
    const progress = hasNext && segLen > 0 ? Math.min(1, distToNext / segLen) : 0;
    const atStation = Number(b.isArriveStation) === 1 || progress < 0.55;

    let remain = null, meters = 0;
    if (myOrder > 0) {
      remain = myOrder - order;                   // 还要经过几站
      if (remain < 0) return;                     // 已经开过去了，不显示
      if (remain === 0 && !atStation) return;     // 刚离站且已走远 → 算开过了
      meters = remain === 0 ? 0 : distToNext;
      for (let i = order; i < mi; i++) meters += state.segs[i] || 0;
    }

    let minutes = null;
    if (remain !== null && remain > 0) {
      const dwell = remain * 0.35;
      minutes = Math.max(1, Math.round(meters / (state.speed || 240) + dwell));
      if (minutes > 99) minutes = 99;
    }
    out.push({
      order,
      plate: b.plateNumber || '',
      remain, minutes, meters,
      atStation,
      stationName: st[order - 1] ? st[order - 1].stationName : '',   // 车刚过的站
      nextName: hasNext ? st[order].stationName : '',
      distToNext, hasNext
    });
  });
  // 有定位时按“还差几站”排序；没定位时按在线路上的先后（越靠近终点越前）
  if (myOrder > 0) {
    out.sort((a, b) => (a.remain - b.remain) || (a.meters - b.meters));
  } else {
    out.sort((a, b) => b.order - a.order);
  }
  return out;
}

function whereIs(b) {
  const verb = b.atStation ? '车在' : '车刚过';
  return `${verb}「${b.stationName}」`;
}
/* 没有可显示的车：直接给出下一班发车时间 + 到你这一站的预计时间 */
function noBusHtml() {
  const d = dirData() || {};
  const nd = nextDepInfo();
  if (!nd) {
    const nm = nowMinute(), first = toMin(d.startFirst), last = toMin(d.startLast);
    let msg = '现在没有车在跑', sub = '';
    if (first >= 0 && last >= 0 && nm > last) {
      msg = '今天已经收班了';
      sub = '末班 ' + hm(d.startLast) + ' · 明天首班 ' + hm(d.startFirst);
    } else if (first >= 0 && nm < first) {
      msg = '还没到发车时间';
      sub = '首班 ' + hm(d.startFirst) + ' 发车 · 还要等 ' + (first - nm) + ' 分钟';
    } else {
      sub = (first >= 0 ? '首班 ' + hm(d.startFirst) : '') + (last >= 0 ? ' · 末班 ' + hm(d.startLast) : '');
    }
    return `<div class="bempty">${msg}<div class="sub">${esc(sub || '稍后会自动刷新')}</div></div>`;
  }
  const mi = nd.mi;
  let l1;
  if (nd.wait > 1) l1 = `还要等 ${nd.wait} 分钟`;
  else if (nd.wait >= -3) l1 = '正在起点站发车，注意看车';
  else l1 = '已从起点站开出';
  const etaTxt = '约 ' + minHM(nd.eta);
  const l2 = (zoomIdx >= 3 && mi >= 0) ? etaTxt + ' 到你这'
    : etaTxt + (mi >= 0 ? ` 到「${state.stations[mi].stationName}」` : ' 到终点站');
  const note = state.raw.length ? '<div class="bnote">路上没有还在你前面的车了</div>' : '';
  return `<div class="brow next">
      <span class="pill">下一班</span>
      <div class="btime">${minHM(nd.dep)}</div>
      <div class="bdesc"><div class="l1">${esc(l1)}</div><div class="l2">${esc(l2)}</div></div>
    </div>${note}`;
}
function busHtml(list) {
  if (!list.length) return noBusHtml();
  const total = state.stations.length;
  // 字体放大后竖向空间紧张，只留最近的一辆
  const maxCards = ZOOMS[zoomIdx] >= 1.24 ? 1 : 2;
  const show = list.slice(0, maxCards);
  let html = show.map((b, i) => {
    let big = '', l1 = '', l2 = '';
    if (b.remain === null) {
      big = '在路上';
      l1 = whereIs(b);
      l2 = `到终点还有 ${total - b.order} 站`;
    } else if (b.remain === 0) {
      big = '已到站';
      l1 = '就在你这一站';
      l2 = '注意看车，别错过';
    } else if (b.remain === 1) {
      big = '马上到';
      l1 = whereIs(b);
      l2 = '下一站就是你' + (b.minutes ? ` · 约${b.minutes}分钟` : '');
    } else {
      big = '约' + b.minutes + '分钟';
      l1 = whereIs(b);
      l2 = `还有 ${b.remain} 站到你这`;
    }
    const pill = i === 0 ? '<span class="pill">最近</span>' : `<span class="pill ghost">第2</span>`;
    return `<div class="brow${i === 0 ? ' first' : ''}">
      ${pill}
      <div class="btime${String(big).length > 5 ? ' sm' : ''}">${esc(big)}</div>
      <div class="bdesc"><div class="l1">${esc(l1)}</div><div class="l2">${esc(l2)}</div></div>
    </div>`;
  }).join('');
  if (list.length > maxCards) {
    html += `<div class="bmore">后面还有 ${list.length - maxCards} 辆车</div>`;
  }
  return html;
}

function renderBuses() {
  const list = computeBuses();
  state.shown = list.length;
  state.nearest = list.length && list[0].remain !== null ? list[0].remain : null;
  const html = busHtml(list);
  if (html !== state.sig) {
    $('buses').innerHTML = html;
    state.sig = html;
  }
  updateBusMarks();
  renderMybar();
  renderRef();
}

/* ==================== 刷新调度 ==================== */
function stopTimer() {
  if (state.timer) { clearTimeout(state.timer); state.timer = null; }
}
function scheduleNext() {
  stopTimer();
  if (state.page !== 'detail') return;
  let ms = 60000;
  const r = state.nearest;
  if (r !== null && r <= 1) ms = 10000;        // 1 站以内 → 10 秒
  else if (r === 2) ms = 15000;                // 2 站 → 15 秒
  state.timer = setTimeout(() => {
    if (document.hidden) { scheduleNext(); return; }
    loadBuses();
  }, ms);
}

async function loadBuses(force) {
  const d = dirData();
  if (!d || !d.id) return;
  if (state.refreshing && !force) return;
  state.refreshing = true;
  const rid = ++state.reqId;
  const keep = state.raw;
  try {
    const data = await apiVehicles(d.id);
    if (rid !== state.reqId || state.page !== 'detail') { state.refreshing = false; return; }
    state.speed = Number(data.busAverageSpeed) || 240;
    state.startTime = data.startTime || '';
    state.raw = Array.isArray(data.list) ? data.list : [];
    state.lastAt = new Date();
    renderBuses();
  } catch (e) {
    if (rid === state.reqId && state.page === 'detail') {
      state.raw = keep;
      if (!state.sig) {
        $('buses').innerHTML = `<div class="bempty">车辆位置没查出来<div class="sub">${esc(e.message || '网络不稳')}，稍后自动重试</div></div>`;
      } else {
        toast('刷新失败，稍后自动重试');
      }
      renderMybar();
    }
  } finally {
    state.refreshing = false;
  }
  scheduleNext();
}

document.addEventListener('visibilitychange', () => {
  if (!document.hidden && state.page === 'detail') loadBuses(true);
});

/* 点站点 = 我在这 */
$('stations').addEventListener('click', e => {
  const row = e.target.closest('.st');
  if (!row) return;
  const id = row.getAttribute('data-id');
  if (!id || id === state.myId) return;
  state.myId = id;
  const saved = LS.get(ST_KEY, {});
  const mi0 = myIndex();
  saved[state.line + '|' + state.dir] = { id: id, name: mi0 >= 0 ? state.stations[mi0].stationName : '' };
  LS.set(ST_KEY, saved);
  renderStations();
  renderBuses();          // 立刻用已有数据重算，不等网络
  const mi = myIndex();
  if (mi >= 0) toast('已选：' + state.stations[mi].stationName);
  loadBuses(true);        // 再拉一次最新位置
});

function goHome() {
  stopTimer();
  state.reqId++;
  setPage('home');
  renderFavs();
  renderLines();
}

/* ==================== 字号调节 ==================== */
const ZOOM_KEY = 'zjbus.zoom';
const ZOOMS = [0.9, 1, 1.12, 1.24, 1.36];
let zoomIdx = Number(LS.get(ZOOM_KEY, 1));
if (!(zoomIdx >= 0 && zoomIdx < ZOOMS.length)) zoomIdx = 1;
function applyZoom() {
  const z = ZOOMS[zoomIdx];
  document.documentElement.style.setProperty('--font-zoom', String(z));
  document.body.setAttribute('data-z', String(z));
  LS.set(ZOOM_KEY, zoomIdx);
  $('fsDown').disabled = zoomIdx === 0;
  $('fsUp').disabled = zoomIdx === ZOOMS.length - 1;
}
$('fsUp').addEventListener('click', () => {
  if (zoomIdx >= ZOOMS.length - 1) return;
  zoomIdx++; applyZoom();
  toast('字体已放大（' + Math.round(ZOOMS[zoomIdx] * 100) + '%）');
});
$('fsDown').addEventListener('click', () => {
  if (zoomIdx <= 0) return;
  zoomIdx--; applyZoom();
  toast('字体已缩小（' + Math.round(ZOOMS[zoomIdx] * 100) + '%）');
});

/* 安卓返回键：先关弹层 → 再回首页 → 否则退出 */
window.androidBack = function () {
  if ($('ttMask').classList.contains('on')) { closeTimetable(); return false; }
  if (state.page === 'detail') { goHome(); return false; }
  return true;
};

/* ==================== 启动 ==================== */
applyZoom();
loadLines();
renderFavs();
renderLines();
</script>
